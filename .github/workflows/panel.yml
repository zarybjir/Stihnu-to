# Sestaví APK panelu pro hodiny při každé změně ve složce panel/.
# Hotovou APK najdeš v Actions → poslední běh → Artifacts → panel-apk.
name: Build panel APK

on:
  push:
    paths:
      - "panel/**"
      - ".github/workflows/panel.yml"
      - "settings.gradle.kts"
      - "build.gradle.kts"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --console=plain :panel:assembleDebug > build.log 2>&1
          rc=$?
          set -e
          cat build.log
          if [ $rc -ne 0 ]; then
            msg=$(grep -E "^e: |error:|What went wrong|Could not|> |FAILURE|Caused by" build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::${msg}"
            exit $rc
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: panel-apk
          path: panel/build/outputs/apk/debug/panel-debug.apk
