# Sestaví APK panelu pro hodiny při každé změně ve složce panel/.
# Hotovou APK najdeš v Actions → poslední běh → Artifacts → panel-apk.
name: Build panel APK

on:
  push:
    paths:
      - "panel/**"
      - ".github/workflows/panel.yml"
      - "settings.gradle.kts"
      - "build.gradle.kts"
  workflow_dispatch:

concurrency:
  group: panel-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore
        env:
          KS_B64: ${{ secrets.PANEL_KEYSTORE_B64 }}
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/panel.keystore"
          echo "PANEL_KEYSTORE=$RUNNER_TEMP/panel.keystore" >> "$GITHUB_ENV"

      - name: Build
        env:
          PANEL_KEYSTORE_PASSWORD: ${{ secrets.PANEL_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --console=plain :panel:assembleDebug > build.log 2>&1
          rc=$?
          set -e
          cat build.log
          if [ $rc -ne 0 ]; then
            msg=$(grep -E "^e: |error:|What went wrong|Could not|> |FAILURE|Caused by" build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::${msg}"
            exit $rc
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: panel-apk
          path: panel/build/outputs/apk/debug/panel-debug.apk

      # Veřejný odkaz ke stažení přímo do hodin:
      # https://github.com/<repo>/releases/download/panel-latest/panel.apk
      - name: Publish
        run: |
          cp panel/build/outputs/apk/debug/panel-debug.apk panel.apk
          # Smaže předchozí vydání (i nepovedené koncepty), posune štítek na tuto verzi
          # a vytvoří vydání znovu — odkaz ke stažení zůstává pořád stejný.
          gh release list --limit 50 --json tagName,name,isDraft \
            --jq '.[] | select(.name | startswith("Panel pro hodiny")) | .tagName' |
            while read -r t; do gh release delete "$t" --yes || true; done
          git push -f origin "$GITHUB_SHA:refs/tags/panel-latest"
          gh release create panel-latest panel.apk --prerelease --verify-tag \
            --title "Panel pro hodiny (nejnovější)" \
            --notes "Automaticky sestaveno z $GITHUB_SHA. Instalace: viz panel/README.md."
        env:
          GH_TOKEN: ${{ github.token }}
